<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 웹사이트 자동 번역 바로가기</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --border-color: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 40px 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2rem;
      color: #1e293b;
      margin-bottom: 10px;
    }

    header p {
      color: #64748b;
      font-size: 1rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    .input-form {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    input[type="url"] {
      flex: 1;
      min-width: 280px;
      padding: 14px 18px;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="url"]:focus {
      border-color: var(--primary-color);
    }

    button.btn-submit {
      padding: 14px 28px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button.btn-submit:hover {
      background-color: var(--primary-hover);
    }

    /* 바로가기 사이트 섹션 */
    .shortcut-section {
      border-top: 2px solid #f1f5f9;
      padding-top: 20px;
    }

    .shortcut-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .shortcut-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .site-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background-color: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      text-decoration: none;
      color: #334155;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .site-card:hover {
      background-color: #e0e7ff;
      border-color: var(--primary-color);
      color: var(--primary-color);
      transform: translateY(-2px);
    }

    .site-card span.icon {
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🌐 웹사이트 번역 바로가기</h1>
    <p>URL을 입력하거나 아래 추천 사이트를 누르면 번역된 상태의 사이트로 이동합니다.</p>
  </header>

  <div class="card">
    <!-- 직접 URL 입력 후 이동 -->
    <form class="input-form" onsubmit="translateAndRedirect(event)">
      <input type="url" id="targetUrl" placeholder="https://... 번역하여 이동할 사이트 URL 입력" required />
      <button type="submit" class="btn-submit">번역 사이트로 이동 ➔</button>
    </form>

    <!-- 클릭 시 자동 번역된 해당 사이트로 즉시 이동하는 버튼들 -->
    <div class="shortcut-section">
      <div class="shortcut-title">⚡ 클릭 시 한국어로 번역되어 즉시 열리는 추천 사이트</div>
      <div class="shortcut-grid">
        <a class="site-card" href="#" onclick="openTranslatedSite('https://en.wikipedia.org')">
          <span class="icon">📖</span> 위키피디아 영문판
        </a>
        <a class="site-card" href="#" onclick="openTranslatedSite('https://news.ycombinator.com')">
          <span class="icon">🚀</span> 해커뉴스 (Hacker News)
        </a>
        <a class="site-card" href="#" onclick="openTranslatedSite('https://www.bbc.com/news')">
          <span class="icon">📰</span> BBC 뉴스 (BBC News)
        </a>
        <a class="site-card" href="#" onclick="openTranslatedSite('https://techcrunch.com')">
          <span class="icon">💻</span> 테크크런치 (TechCrunch)
        </a>
        <a class="site-card" href="#" onclick="openTranslatedSite('https://dev.to')">
          <span class="icon">✍️</span> Dev.to 개발 블로그
        </a>
        <a class="site-card" href="#" onclick="openTranslatedSite('https://www.reddit.com')">
          <span class="icon">💬</span> 레딧 (Reddit)
        </a>
      </div>
    </div>
  </div>
</div>

<script>
  // 지정한 URL을 구글 번역 엔진 주소로 변환해 주는 함수
  function getGoogleTranslateUrl(originalUrl) {
    // http:// 또는 https:// 가 없는 경우 자동으로 붙여줌
    let target = originalUrl.trim();
    if (!target.startsWith('http://') && !target.startsWith('https://')) {
      target = 'https://' + target;
    }
    
    // sl=auto (자동 언어감지), tl=ko (한국어로 번역), u=대상URL
    return `https://translate.google.com/translate?sl=auto&tl=ko&u=${encodeURIComponent(target)}`;
  }

  // 1. 직접 주소 입력 후 제출 시 해당 웹사이트로 이동
  function translateAndRedirect(event) {
    event.preventDefault();
    const url = document.getElementById('targetUrl').value;
    if (url) {
      window.location.href = getGoogleTranslateUrl(url);
    }
  }

  // 2. 하단 바로가기 버튼 클릭 시 해당 웹사이트로 이동
  function openTranslatedSite(url) {
    window.location.href = getGoogleTranslateUrl(url);
  }
</script>

</body>
</html>
